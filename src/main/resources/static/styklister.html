<!DOCTYPE html>
<html lang="da">
<head>
   <meta charset="utf-8">
   <title>ElektroStorage</title>
</head>

<body>
   <h1>ElektroStorage - Styklister</h1>
   <hr>

   <h3>Liste over styklister</h3>

   <ul id="billList"></ul>

   <script>
      fetch("/styklister")
         .then(response => response.json())
         .then(bills => {

            const billList = document.getElementById("billList");

            bills.forEach(bill => {

               const li = document.createElement("li");

               li.textContent = bill.name;

               billList.appendChild(li);
            });
         });
   </script>

</body>
</html>
