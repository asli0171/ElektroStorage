<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="utf-8">
    <title>ElektroStorage</title>
</head>

<body>
    <h1>ElektroStorage - Bestillinger</h1>
    <hr>

    <h3>Liste over bestillinger</h3>

    <ul id="orderList"></ul>

    <script>
        fetch("/bestillinger")
            .then(response => response.json())
            .then(orders => {
                const orderList = document.getElementById("orderList");

                orders
                    .filter(order => !order.modtagetDato)
                    .forEach(order => {
                        const li = document.createElement("li");

                        li.innerHTML = `
                        <a href="/ordrer.html?id=${order.id}">
                            Bestilling #${order.id}
                        </a>
                    `;

                        orderList.appendChild(li);
                    });
            });
    </script>


</body>
</html>
